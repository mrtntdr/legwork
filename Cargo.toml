[package]
name = "legwork"
version = "0.2.0"
edition = "2024"
description = "Orienteering analysis app inspired by QuickRoute"
authors = ["Legwork"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
eframe = "0.35.0"
egui = "0.35.0"
egui_extras = "0.35.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "tiff", "bmp", "webp"] }
nalgebra = "0.35.0"
quick-xml = "0.41.0"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Deflate-only: the default features pull zstd/bzip2 (C code) which don't build
# for wasm32. The project writer only ever emits Deflated entries, so this is
# lossless for reading and writing `.legit` bundles.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Web (wasm) build: browser glue for the entry point and file up/download.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "console",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "Url",
    "Window",
] }

[package]
name = "legwork"
version = "0.1.0"
edition = "2024"
description = "Orienteering analysis app inspired by QuickRoute"
authors = ["Legwork"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
eframe = "0.35.0"
egui = "0.35.0"
egui_extras = "0.35.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "tiff", "bmp", "webp"] }
nalgebra = "0.35.0"
quick-xml = "0.41.0"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
zip = "8.6.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
